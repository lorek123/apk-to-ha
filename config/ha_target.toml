# Single source of truth for Home Assistant version targeting.
# All emitters consult this. V-3 pulls the matching Docker image.
# Anchor integrations are snapshotted from this release tag.
#
# Update path: a weekly GitHub Action opens a PR bumping these values
# and runs the full fixture suite. Auto-merges if green.

[target]
ha_core_version = "2026.5.2"
python_version = "3.14"
quality_scale_target = "platinum"

# minimum_required_version emitted into generated manifest.json files.
# Usually matches ha_core_version but can lag by one release cycle
# for compatibility with users on the prior monthly.
generated_minimum_required = "2026.5.0"

[docker]
# Image tag for V-3's HA container test.
ha_image = "homeassistant/home-assistant"
ha_image_tag = "2026.5.2"

[anchors]
# Pulled from HA Core at this commit/tag for fixtures/anchors/.
# Bump in lockstep with ha_core_version.
ref = "2026.5.2"
