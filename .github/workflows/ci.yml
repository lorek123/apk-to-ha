# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev --all-extras --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: phcc pin matches HA pin
        # V-3's sandbox installs this phcc release; it must pin exactly ha_core_version.
        run: |
          uv run python - <<'PY'
          import tomllib
          from scripts.bump_ha_version import find_phcc_version
          cfg = tomllib.load(open("config/ha_target.toml", "rb"))
          ha, pinned = cfg["target"]["ha_core_version"], cfg["sandbox"]["phcc_version"]
          expected = find_phcc_version(ha)
          assert pinned == expected, f"phcc_version {pinned} != {expected} (pins HA {ha})"
          print(f"phcc {pinned} pins HA {ha}")
          PY

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev --all-extras --locked

      - name: Run tests
        run: uv run pytest -ra

  verify-spdx-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX headers
        run: |
          set -e
          MISSING=0
          while IFS= read -r -d '' file; do
            head -5 "$file" | grep -q "SPDX-License-Identifier: MIT" || {
              echo "::error file=$file::Missing SPDX-License-Identifier"
              MISSING=$((MISSING + 1))
            }
          done < <(find . -type f \( -name "*.py" -o -name "*.sh" -o -name "*.toml" \) \
                       -not -path "./.git/*" \
                       -not -path "./.cache/*" \
                       -not -path "./runs/*" \
                       -not -path "./fixtures/_cache/*" \
                       -print0)
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING file(s) missing SPDX headers"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
