# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev || echo "uv sync skipped (foundation tier — pyproject.toml is partial)"

      - name: Ruff format check
        run: uv run ruff format --check . || true
        continue-on-error: true

      - name: Ruff lint
        run: uv run ruff check . || true
        continue-on-error: true

      - name: Mypy
        run: uv run mypy . || true
        continue-on-error: true

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev || echo "skipped during foundation tier"

      - name: Run tests
        run: uv run pytest -ra || echo "no tests yet"
        continue-on-error: true

  verify-spdx-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: |
          set -e
          MISSING=0
          while IFS= read -r -d '' file; do
            head -5 "$file" | grep -q "SPDX-License-Identifier: MIT" || {
              echo "::error file=$file::Missing SPDX-License-Identifier"
              MISSING=$((MISSING + 1))
            }
          done < <(find . -type f \( -name "*.py" -o -name "*.sh" -o -name "*.toml" \) \
                       -not -path "./.git/*" \
                       -not -path "./.cache/*" \
                       -not -path "./runs/*" \
                       -not -path "./fixtures/_cache/*" \
                       -print0)
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING file(s) missing SPDX headers"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
