# SPDX-License-Identifier: MIT
# F-7 — Weekly HA Core version bump check.
#
# Every Monday at 06:00 UTC: fetch the latest HA Core release, compare to
# the pinned version in config/ha_target.toml. If different, bump the pin,
# run the fixture suite, and open a PR. Auto-merge is delegated to a branch
# protection rule on main (auto-merge if all required checks pass).

name: HA Core version bump

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Fetch latest HA Core release tag
        id: latest
        run: |
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/home-assistant/core/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest HA Core release: $TAG"

      - name: Read current pinned version
        id: pinned
        run: |
          VER=$(python3 -c "
          import tomllib
          with open('config/ha_target.toml', 'rb') as f:
              print(tomllib.load(f)['target']['ha_core_version'])
          ")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $VER"

      - name: Decide if update is needed
        id: decide
        run: |
          if [ "${{ steps.latest.outputs.tag }}" = "${{ steps.pinned.outputs.version }}" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already at latest — nothing to do."
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump ha_target.toml
        if: steps.decide.outputs.needs_update == 'true'
        run: uv run python scripts/bump_ha_version.py "${{ steps.latest.outputs.tag }}"

      - name: Run fixture suite against new pin
        if: steps.decide.outputs.needs_update == 'true'
        id: tests
        run: uv run pytest -ra --tb=short
        continue-on-error: true  # PR is opened regardless; green/red shows in CI

      - name: Open bump PR
        if: steps.decide.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "chore/ha-bump-${{ steps.latest.outputs.tag }}"
          commit-message: "chore: bump HA Core pin to ${{ steps.latest.outputs.tag }}"
          title: "chore: bump HA Core pin → ${{ steps.latest.outputs.tag }}"
          body: |
            Automated weekly HA Core version bump.

            | Field | Value |
            |---|---|
            | Previous pin | `${{ steps.pinned.outputs.version }}` |
            | New pin | `${{ steps.latest.outputs.tag }}` |
            | Fixture suite | ${{ steps.tests.outcome == 'success' && '✅ passing' || '❌ failing — review before merge' }} |

            Generated by the weekly `ha-bump` workflow.
          labels: "dependencies,automated"
          delete-branch: true
