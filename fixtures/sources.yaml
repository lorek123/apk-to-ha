# Verification fixtures — apps with KNOWN existing HA integrations.
# These should ALL trigger P-2.5's "skip" verdict.
duplicate_detection_fixtures:
  - id: shelly_app
    description: "Shelly app — HA Core has 'shelly' integration"
    expected_existing: "core/shelly"
  - id: esphome_app
    description: "ESPHome app — HA Core has 'esphome' integration"
    expected_existing: "core/esphome"
