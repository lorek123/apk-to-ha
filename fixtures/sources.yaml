# F-2b — Fixture corpus.
#
# APK binaries are NEVER committed to this repository. This file lists the
# canonical download sources. `make fixtures` (TBD) pulls them locally into
# fixtures/_cache/ which is gitignored. Distilled derivatives go in
# fixtures/snapshots/ (committed) per F-2a.
#
# Annotate each entry with its license to keep the legal picture clear.

apks:
  # Native Java/Kotlin WebSocket — M1 primary fixture
  - id: bullb_r2d2
    description: "Build Your Own R2-D2 v1.1.31 by Bullb — WebSocket + UDP discovery, no signing"
    framework: native
    branch: M1
    package: com.bullb.r2d2
    license: proprietary
    source: "https://apkpure.com/build-your-own-r2-d2/com.bullb.r2d2"
    apk_url: "https://example.invalid/replace.me.apk"   # proprietary — download manually to fixtures/_cache/
    local_path: "fixtures/_cache/Build Your Own R2-D2_1.1.31_release_APKPure.apk"
    expected_verdict: proceed
    transport: websocket
    transport_port: 8887
    discovery: udp_broadcast
    discovery_port: 8090
    auth: handshake_grant_access
    notes: "Primary M1 reference. Pure WebSocket, JSON commands, gin push state. No HTTP endpoints."

  - id: native_retrofit_b
    description: "Second Retrofit example for redundancy (TBD)"
    framework: native
    branch: M1
    license: Apache-2.0
    source: "TBD"
    apk_url: "https://example.invalid/replace.me.apk"
    expected_verdict: proceed

  # Native OkHttp without Retrofit
  - id: native_okhttp
    description: "Hand-rolled OkHttp client, no Retrofit annotations"
    framework: native
    branch: M1
    license: TBD
    source: "TBD"
    apk_url: "https://example.invalid/replace.me.apk"
    expected_verdict: proceed

  # Tuya clone — must trigger early-exit (P1-2)
  - id: tuya_clone
    description: "SmartLife / Tuya-clone app — pipeline should bail to tinytuya"
    framework: native
    branch: M1
    license: TBD
    source: "TBD"
    apk_url: "https://example.invalid/replace.me.apk"
    expected_verdict: skip
    expected_reason: "tuya_detected_use_tinytuya"

  # Flutter — M3
  - id: flutter_app
    description: "Flutter AOT app for blutter/reFlutter path testing"
    framework: flutter
    branch: M3
    license: TBD
    source: "TBD"
    apk_url: "https://example.invalid/replace.me.apk"
    expected_verdict: proceed

  # React Native — M3
  - id: react_native_app
    description: "RN app with index.android.bundle to extract"
    framework: react_native
    branch: M3
    license: TBD
    source: "TBD"
    apk_url: "https://example.invalid/replace.me.apk"
    expected_verdict: proceed

  # BLE-only — M3
  - id: ble_only
    description: "Device app with BluetoothGatt characteristic R/W, no HTTP"
    framework: native
    branch: M3
    license: TBD
    source: "TBD"
    apk_url: "https://example.invalid/replace.me.apk"
