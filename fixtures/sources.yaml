# SPDX-License-Identifier: MIT
# F-2b — Fixture corpus.
#
# APK binaries are NEVER committed to this repository. This file lists the
# canonical download sources. `make fixtures` (TBD) pulls them locally into
# fixtures/_cache/ which is gitignored. Distilled derivatives go in
# fixtures/snapshots/ (committed) per F-2a.
#
# Annotate each entry with its license to keep the legal picture clear.

apks:
  # Native Java/Kotlin WebSocket — M1 primary fixture
  - id: bullb_r2d2
    description: "Build Your Own R2-D2 v1.1.31 by Bullb — WebSocket + UDP discovery, no signing"
    framework: native
    branch: M1
    package: com.bullb.r2d2
    license: proprietary
    source: "https://apkpure.com/build-your-own-r2-d2/com.bullb.r2d2"
    apk_url: "https://example.invalid/replace.me.apk"   # proprietary — download manually to fixtures/_cache/
    local_path: "fixtures/_cache/Build Your Own R2-D2_1.1.31_release_APKPure.apk"
    expected_verdict: proceed
    transport: websocket
    transport_port: 8887
    discovery: udp_broadcast
    discovery_port: 8090
    auth: handshake_grant_access
    notes: "Primary M1 reference. Pure WebSocket, JSON commands, gin push state. No HTTP endpoints."

  # ── F-Droid corpus ──────────────────────────────────────────────────────
  # Free-software apps from f-droid.org (URLs pinned to a version code).
  # `group` ties clients of the same API together: their IRs should agree.

  # Jellyfin clients: one API, four codebases/frameworks. HA Core ships a
  # `jellyfin` integration, so P-2.5 should stop generation for all of them.
  - id: jellyfin_mobile
    description: "Jellyfin official Android app — native shell around the web client"
    framework: native
    branch: M1
    package: org.jellyfin.mobile
    license: GPL-2.0-or-later
    source: "https://f-droid.org/packages/org.jellyfin.mobile/"
    apk_url: "https://f-droid.org/repo/org.jellyfin.mobile_2070399.apk"
    version_code: 2070399
    group: jellyfin
    expected_verdict: skip
    expected_existing: "core/jellyfin"

  - id: jellyfin_androidtv
    description: "Jellyfin for Android TV — native Kotlin on the Jellyfin SDK"
    framework: native
    branch: M1
    package: org.jellyfin.androidtv
    license: GPL-2.0-or-later
    source: "https://f-droid.org/packages/org.jellyfin.androidtv/"
    apk_url: "https://f-droid.org/repo/org.jellyfin.androidtv_191099.apk"
    version_code: 191099
    group: jellyfin
    expected_verdict: skip
    expected_existing: "core/jellyfin"

  - id: findroid
    description: "Findroid — third-party native Jellyfin client"
    framework: native
    branch: M1
    package: dev.jdtech.jellyfin
    license: GPL-3.0-only
    source: "https://f-droid.org/packages/dev.jdtech.jellyfin/"
    apk_url: "https://f-droid.org/repo/dev.jdtech.jellyfin_33.apk"
    version_code: 33
    group: jellyfin
    expected_verdict: skip
    expected_existing: "core/jellyfin"

  - id: finamp
    description: "Finamp — Flutter Jellyfin music client"
    framework: flutter
    branch: M3
    package: com.unicornsonlsd.finamp
    license: MPL-2.0
    source: "https://f-droid.org/packages/com.unicornsonlsd.finamp/"
    apk_url: "https://f-droid.org/repo/com.unicornsonlsd.finamp_52.apk"
    version_code: 52
    group: jellyfin
    expected_verdict: skip
    expected_existing: "core/jellyfin"

