# SPDX-License-Identifier: MIT
[project]
name = "hacs-integration-engine"
version = "0.0.0"
description = "Reverse-engineer an Android APK and emit a Platinum-tier Home Assistant integration."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "HACS Integration Engine contributors" },
]
keywords = ["home-assistant", "hacs", "reverse-engineering", "android", "apk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.14.1",
    "bleak>=0.22",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "tomli; python_version<'3.11'",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.1",
    "google-play-scraper>=1.2.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/lorek123/apk-to-ha"
Issues = "https://github.com/lorek123/apk-to-ha/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

# ────────────────────────────────────────────────────────────────
# Ruff — formatting + linting
# ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "ASYNC",              # async-specific
    "S",                  # bandit (security)
    "RUF",                # ruff-specific
]
ignore = [
    "S101",  # Use of `assert` — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

# ────────────────────────────────────────────────────────────────
# Mypy — strict typing
# ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bleak.*"]
ignore_missing_imports = true

# ────────────────────────────────────────────────────────────────
# Pytest
# ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:google_play_scraper.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
