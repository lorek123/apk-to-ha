# SPDX-License-Identifier: MIT
[project]
name = "hacs-integration-engine"
version = "0.0.0"
description = "Reverse-engineer an Android APK and emit a Platinum-tier Home Assistant integration."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "HACS Integration Engine contributors" },
]
keywords = ["home-assistant", "hacs", "reverse-engineering", "android", "apk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.10",
    "bleak>=0.22",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "tomli; python_version<'3.11'",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.1",
    "google-play-scraper>=1.2.7",
    "tree-sitter>=0.25",
    "tree-sitter-java>=0.23",
    "frida>=17.0",
    "openapi-spec-validator>=0.7",
    "esprima>=4.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]

[project.urls]
Repository = "https://github.com/lorek123/apk-to-ha"
Issues = "https://github.com/lorek123/apk-to-ha/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

# ────────────────────────────────────────────────────────────────
# Ruff — formatting + linting
# ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".cache", ".claude", "runs", "sdk_output", "fixtures/_cache", "tests/golden"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "ASYNC",              # async-specific
    "S",                  # bandit (security)
    "RUF",                # ruff-specific
]
ignore = [
    "S101",  # Use of `assert` — fine in tests
    "S603",  # subprocess with list args: we shell out to fixed tools (jadx, ruff, docker, adb)
    "S607",  # ...resolved from PATH on purpose so the dev/CI toolchain is used
    "S701",  # Jinja templates emit Python/JSON source, not HTML — autoescape would corrupt it
    "UP042", # (str, Enum) → StrEnum changes str()/format() output of IR enums
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

# ────────────────────────────────────────────────────────────────
# Mypy — strict typing
# ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
explicit_package_bases = true
files = ["src", "tests"]
exclude = ["^sdk_output/", "^runs/", "^\\.cache/", "^\\.claude/", "^tests/golden/"]

[[tool.mypy.overrides]]
module = ["bleak.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["esprima.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["frida.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["google_play_scraper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openapi_spec_validator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_java.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

# ────────────────────────────────────────────────────────────────
# Pytest
# ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --ignore=tests/golden"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:google_play_scraper.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260518",
    "cryptography>=42",
]
